<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote For Samian</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Determination Mono';
      src: url('https://cdn.jsdelivr.net/gh/yurijmi/Determination/DeterminationMonoWebRegular.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --bg-mint: #f0fdfa;
      --bg-pink: #fdf2f0;
      --body-bg: #0f172a;
      --card-bg: #1e293b;
      --topbar-bg: rgba(30, 41, 59, 0.85);
      --text-dark: #ffffff;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --input-bg: #0f172a;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --danger: #ef4444;
      --warning: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
      --badge-bg: #064e3b;
      --badge-border: #059669;
      --badge-text: #a7f3d0;
      --filter-bg: #334155;
      --filter-text: #94a3b8;
      --preview-bg: #0f172a;
    }

    body.light-mode {
      --body-bg: linear-gradient(135deg, var(--bg-mint) 0%, var(--bg-pink) 100%);
      --card-bg: #ffffff;
      --topbar-bg: rgba(255, 255, 255, 0.85);
      --text-dark: #111827;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --input-bg: #f9fafb;
      --badge-bg: #ecfdf5;
      --badge-border: #a7f3d0;
      --badge-text: #047857;
      --filter-bg: #f3f4f6;
      --filter-text: #6b7280;
      --preview-bg: #f9fafb;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    body {
      font-size: 1rem;
      line-height: 1.5;
      color: var(--text-dark);
      margin: 0;
      padding: 100px 20px 40px;
      background: var(--body-bg);
      background-attachment: fixed;
    }

    #pausedBanner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #fee2e2;
      color: var(--danger);
      text-align: center;
      padding: 10px 15px;
      font-size: 0.95rem;
      font-weight: 600;
      z-index: 20000;
      border-bottom: 1px solid #fca5a5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .top-bar {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      width: 90%;
      max-width: 860px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--topbar-bg);
      padding: 10px 24px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(8px);
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-dark);
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .auth-btn {
      background: #4285f4;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-profile img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    .theme-toggle-btn {
      background: var(--filter-bg);
      color: var(--text-dark);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    header {
      text-align: center;
      padding: 10px 0 30px;
    }

    .rainbow-header {
      font-family: 'Determination Mono', 'Press Start 2P', monospace !important;
      font-size: 3.5rem;
      margin: 0;
      background: linear-gradient(
        90deg,
        #ff0000 0%,
        #ff7f00 16.6%,
        #ffff00 33.3%,
        #00ff00 50%,
        #0000ff 66.6%,
        #8b00ff 83.3%,
        #ff0000 100%
      );
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: rainbowLoop 3s linear infinite;
    }

    @keyframes rainbowLoop {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .category-block {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .category-block h2,
    .category-block h3 {
      color: var(--text-dark);
      margin-top: 0;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .checkbox-group input {
      width: auto;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-dark);
      font-size: 0.9rem;
      font-weight: 600;
    }

    input[type="text"],
    textarea,
    input[type="file"],
    select {
      font-size: 0.95rem;
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-dark);
      outline: none;
    }

    button.submit-btn {
      background: var(--accent-green);
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
    }

    button.submit-btn:hover {
      background: var(--accent-green-hover);
    }

    .edit-btn {
      background: var(--warning);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      margin-top: 8px;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .filter-left-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .filter-right-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-btn {
      background: var(--filter-bg);
      border: 1px solid transparent;
      color: var(--filter-text);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: var(--accent-green);
      color: #fff;
    }

    .search-input {
      flex: 1;
      min-width: 160px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 6px 14px;
      color: var(--text-dark);
      font-size: 0.875rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .grid.compact-grid {
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .compact-card,
    .card {
      transition: transform 0.25s ease, opacity 0.25s ease, border-color 0.2s ease;
    }

    .compact-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }

    .compact-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent-green);
    }

    .compact-preview {
      width: 100%;
      height: 90px;
      background: var(--preview-bg);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .compact-preview img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .compact-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      margin: 0;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .badge-top {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--badge-text);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      z-index: 2;
    }

    .preview-box {
      width: 100%;
      height: 160px;
      background: var(--preview-bg);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px dashed var(--border-color);
      cursor: pointer;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .star-rating {
      display: inline-flex;
      gap: 4px;
      margin: 8px 0;
      justify-content: center;
    }

    .star-rating .star {
      font-size: 1.25rem;
      color: var(--border-color);
      cursor: pointer;
    }

    .star-rating .star.filled {
      color: #f59e0b;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .vote-btn,
    .unvote-btn {
      font-size: 0.875rem;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
      font-weight: 600;
    }

    .vote-btn {
      background: var(--accent-green);
      color: #fff;
    }

    .unvote-btn {
      background: #fee2e2;
      color: var(--danger);
    }

    .vote-btn:disabled,
    .unvote-btn:disabled {
      background: var(--border-color);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .pagination-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
    }

    .page-btn {
      background: var(--filter-bg);
      border: 1px solid var(--border-color);
      color: var(--text-dark);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }

    .page-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 30000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
    }

    .modal-content {
      background-color: var(--card-bg);
      margin: 5% auto;
      padding: 24px;
      border: 1px solid var(--border-color);
      width: 90%;
      max-width: 500px;
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      position: relative;
    }

    .lightbox-modal {
      display: none;
      position: fixed;
      z-index: 40000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
    }

    .lightbox-modal.show {
      opacity: 1;
    }

    .lightbox-content {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 8px;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 36px;
      font-weight: bold;
      cursor: pointer;
    }

    .close-btn {
      color: var(--text-muted);
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      margin-top: 40px;
      padding: 20px 24px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
    }

    footer .footer-left a {
      color: var(--accent-green);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    footer .footer-right {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      text-align: right;
    }

    @media (max-width: 600px) {
      body {
        padding-left: 12px;
        padding-right: 12px;
      }

      .top-bar {
        width: 94%;
        padding: 8px 12px;
      }

      .rainbow-header {
        font-size: 2.1rem;
      }

      .category-block {
        padding: 18px;
      }

      .top-controls {
        gap: 5px;
      }

      .theme-toggle-btn {
        padding: 6px 9px;
      }
    }
  </style>
</head>

<body>

<div id="pausedBanner">
  Voting has been temporarily paused by admins.
</div>

<div class="top-bar">
  <div id="voteStatus">
    Votes remaining: <strong>5</strong>
  </div>

  <div class="top-controls">
    <div id="authContainer">
      <button class="auth-btn" onclick="playClickSound(); handleGoogleSignIn()">
        Sign In
      </button>
    </div>

    <button class="theme-toggle-btn"
            id="themeToggleBtn"
            onclick="playClickSound(); toggleTheme()">
      <span id="themeIcon">☀️</span>
      <span id="themeText">Light Mode</span>
    </button>
  </div>
</div>

<header>
  <h1 class="rainbow-header">VOTE FOR SAMIAN!</h1>
</header>

<div class="container">

  <div id="announcementBlock"
       class="category-block"
       style="display:none; border-color:var(--warning);">

    <h3>📢 Announcements</h3>

    <ul id="announcementsDisplayContainer"
        style="padding-left:20px;margin:0;color:var(--text-dark);">
    </ul>

  </div>

  <div class="category-block">

    <h3>📜 Event Rules</h3>

    <ul id="rulesDisplayContainer"
        style="padding-left:20px;margin:0;color:var(--text-dark);">
    </ul>

  </div>

  <div class="category-block">

    <h2>Submit Your Entry</h2>

    <form id="uploadForm">

      <div class="form-group">
        <label>Submission Name *</label>
        <input
          type="text"
          id="entryName"
          required
          placeholder="Project Name">
      </div>

      <div class="form-group">
        <label>Creator Name *</label>
        <input
          type="text"
          id="creatorName"
          required
          placeholder="Your Name or Tag">
      </div>

      <div class="form-group">

        <label>Location Tag *</label>

        <select id="locationTag" required>

          <option value="" disabled selected>
            Select a tag...
          </option>

          <option value="(Navana)">(Navana)</option>
          <option value="(School)">(School)</option>
          <option value="(Dhaka)">(Dhaka)</option>
          <option value="(Facebook)">(Facebook)</option>
          <option value="(Other)">(Other)</option>

        </select>

      </div>

      <div class="form-group">

        <label>Main Image / Graphic *</label>

        <input
          type="file"
          id="imageFile"
          accept="image/*,.svg"
          required>

      </div>

      <div class="form-group">

        <label>Description (Optional)</label>

        <textarea
          id="desc"
          rows="3"
          placeholder="Project details or links...">
        </textarea>

      </div>

      <div
        class="checkbox-group"
        id="hideEmailGroup"
        style="display:none;">

        <input type="checkbox" id="hideEmail">

        <label
          for="hideEmail"
          style="margin-bottom:0;">
          Hide my email from public view
        </label>

      </div>

      <button
        type="submit"
        class="submit-btn"
        id="btnSubmit">
        Publish Submission
      </button>

    </form>

  </div>

  <div class="category-block">

    <h2>🏆 Leaderboard (Top 5)</h2>

    <div class="grid" id="topGrid"></div>

  </div>

  <div class="category-block">

    <h2>🎨 All Submissions</h2>

    <div class="filter-bar">

      <div class="filter-left-group">

        <button
          class="filter-btn active"
          id="tagAll"
          onclick="playClickSound();setTagFilter('ALL')">
          All
        </button>

        <button
          class="filter-btn"
          id="tagNavana"
          onclick="playClickSound();setTagFilter('(Navana)')">
          Navana
        </button>

        <button
          class="filter-btn"
          id="tagSchool"
          onclick="playClickSound();setTagFilter('(School)')">
          School
        </button>

        <button
          class="filter-btn"
          id="tagDhaka"
          onclick="playClickSound();setTagFilter('(Dhaka)')">
          Dhaka
        </button>

        <button
          class="filter-btn"
          id="tagFacebook"
          onclick="playClickSound();setTagFilter('(Facebook)')">
          Facebook
        </button>

        <button
          class="filter-btn"
          id="tagOther"
          onclick="playClickSound();setTagFilter('(Other)')">
          Other
        </button>

        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search entries..."
          oninput="handleSearchInput(event)">

      </div>

      <div class="filter-right-group">

        <input
          type="checkbox"
          id="makeImagesSmallerToggle"
          onchange="playClickSound();toggleMakeImagesSmaller()">

        <label
          for="makeImagesSmallerToggle"
          style="margin-bottom:0;font-size:.875rem;cursor:pointer;font-weight:600;">
          Make images smaller
        </label>

      </div>

    </div>

    <div class="grid" id="allGrid"></div>

    <div id="paginationContainer"></div>

  </div>

  <footer>

    <div class="footer-left">

      <a
        href="https://www.facebook.com/muhammad.zain.690534"
        target="_blank"
        rel="noopener noreferrer">
        🌐 Facebook
      </a>

    </div>

    <div class="footer-right">
      Navana Probani Ridgedale, Mirpur, Dhaka
    </div>

  </footer>

</div>

<div id="editModal" class="modal">

  <div class="modal-content">

    <span
      class="close-btn"
      onclick="closeEditModal()">
      &times;
    </span>

    <h2>Edit Submission</h2>

    <form id="editForm">

      <input type="hidden" id="editEntryId">

      <div class="form-group">

        <label>Submission Name *</label>

        <input
          type="text"
          id="editEntryName"
          required>

      </div>

      <div class="form-group">

        <label>Creator Name *</label>

        <input
          type="text"
          id="editCreatorName"
          required>

      </div>

      <div class="form-group">

        <label>Location Tag *</label>

        <select
          id="editLocationTag"
          required>

          <option value="(Navana)">(Navana)</option>
          <option value="(School)">(School)</option>
          <option value="(Dhaka)">(Dhaka)</option>
          <option value="(Facebook)">(Facebook)</option>
          <option value="(Other)">(Other)</option>

        </select>

      </div>

      <div class="form-group">

        <label>Update Image (Optional)</label>

        <input
          type="file"
          id="editImageFile"
          accept="image/*,.svg">

      </div>

      <div class="form-group">

        <label>Description (Optional)</label>

        <textarea
          id="editDesc"
          rows="3">
        </textarea>

      </div>

      <div class="checkbox-group">

        <input
          type="checkbox"
          id="editHideEmail">

        <label
          for="editHideEmail"
          style="margin-bottom:0;">
          Hide my email from public view
        </label>

      </div>

      <button
        type="submit"
        class="submit-btn">
        Save Changes (Re-verifies Entry)
      </button>

    </form>

  </div>

</div>

<div id="detailModal" class="modal">

  <div
    class="modal-content"
    id="detailModalContent">

    <span
      class="close-btn"
      onclick="closeDetailModal()">
      &times;
    </span>

    <div id="detailModalBody"></div>

  </div>

</div>

<div
  id="lightboxModal"
  class="lightbox-modal"
  onclick="closeLightbox()">

  <span
    class="lightbox-close"
    onclick="closeLightbox()">
    &times;
  </span>

  <img
    class="lightbox-content"
    id="lightboxImg">

</div>

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    doc,
    updateDoc,
    increment
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const audioCtx =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  window.playClickSound = () => {

    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();

    const gain = audioCtx.createGain();

    osc.type = "sine";

    osc.frequency.setValueAtTime(
      800,
      audioCtx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
      400,
      audioCtx.currentTime + 0.05
    );

    gain.gain.setValueAtTime(
      0.15,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.01,
      audioCtx.currentTime + 0.05
    );

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
      audioCtx.currentTime + 0.05
    );
